name: Sync fork with upstream

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync with upstream
        run: |
          git remote add upstream "https://github.com/twikoojs/twikoo-cloudflare.git"
          git fetch upstream
          git checkout main
          git merge "upstream/main" --ff-only
          git push origin main
