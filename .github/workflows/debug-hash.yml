name: Debug Token Hash

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Hash token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "token length: ${#CLOUDFLARE_API_TOKEN}"
          echo -n "$CLOUDFLARE_API_TOKEN" | sha256sum
          echo "expected: bff7442ed6747d8c (local first 16)"
