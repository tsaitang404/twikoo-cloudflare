name: Debug CF Network

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Direct CF API calls
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "=== /accounts direct ==="
          curl -s -m 15 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts?per_page=5" | head -c 250
          echo ""
          echo "=== /workers/scripts direct ==="
          curl -s -m 15 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/7831d21cea4fc12c509aaa9ca2d050a6/workers/scripts" | head -c 250
